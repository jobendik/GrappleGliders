<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0524"/>
      <stop offset="0.55" stop-color="#1a0c46"/>
      <stop offset="1" stop-color="#ff2bff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="0.5" stop-color="#c566ff"/>
      <stop offset="1" stop-color="#ff2bff"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd400"/>
      <stop offset="0.5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff255e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#1f1352" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Sky gradient -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Sun -->
  <circle cx="600" cy="430" r="170" fill="#ff7a1a" opacity="0.55" filter="url(#bloom)"/>
  <circle cx="600" cy="430" r="120" fill="#ffd400" opacity="0.75"/>

  <!-- Horizon perspective lines -->
  <g stroke="#ff2bff" stroke-width="2" opacity="0.5">
    <line x1="0" y1="430" x2="1200" y2="430"/>
    <line x1="0" y1="460" x2="1200" y2="460" opacity="0.5"/>
    <line x1="0" y1="495" x2="1200" y2="495" opacity="0.3"/>
  </g>

  <!-- Skyline silhouette -->
  <g fill="#03040a">
    <rect x="60" y="320" width="40" height="110"/>
    <rect x="120" y="280" width="56" height="150"/>
    <rect x="200" y="345" width="34" height="85"/>
    <rect x="250" y="290" width="48" height="140"/>
    <rect x="1020" y="270" width="62" height="160"/>
    <rect x="1100" y="320" width="44" height="110"/>
    <polygon points="900,430 940,290 980,430"/>
    <polygon points="820,430 855,330 890,430"/>
  </g>

  <!-- Floating platforms -->
  <g>
    <rect x="180" y="220" width="120" height="14" fill="#00f3ff" filter="url(#bloom)" opacity="0.9"/>
    <rect x="180" y="220" width="120" height="14" fill="#00f3ff"/>
    <rect x="800" y="180" width="140" height="14" fill="#a45cff" filter="url(#bloom)" opacity="0.9"/>
    <rect x="800" y="180" width="140" height="14" fill="#a45cff"/>
    <rect x="950" y="320" width="100" height="14" fill="#00f3ff" filter="url(#bloom)" opacity="0.9"/>
    <rect x="950" y="320" width="100" height="14" fill="#00f3ff"/>
    <circle cx="500" cy="160" r="20" fill="#a45cff" filter="url(#bloom)" opacity="0.9"/>
    <circle cx="500" cy="160" r="14" fill="#a45cff"/>
  </g>

  <!-- Grapple hook line -->
  <line x1="420" y1="340" x2="500" y2="160" stroke="#00f3ff" stroke-width="3" opacity="0.9"/>
  <line x1="420" y1="340" x2="500" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.65"/>

  <!-- Glider (player) -->
  <g transform="translate(420 340)">
    <circle r="44" fill="url(#glow)"/>
    <polygon points="0,-22 20,16 0,8 -20,16" fill="#00f3ff" filter="url(#bloom)"/>
    <polygon points="0,-22 20,16 0,8 -20,16" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Trail behind glider -->
  <path d="M 360 410 Q 390 380 420 340" fill="none" stroke="#ff2bff" stroke-width="6" opacity="0.55" filter="url(#bloom)"/>
  <path d="M 360 410 Q 390 380 420 340" fill="none" stroke="#00f3ff" stroke-width="3" opacity="0.85"/>

  <!-- Title -->
  <g font-family="'Orbitron', 'Arial Black', sans-serif" font-weight="900">
    <text x="60" y="180" font-size="120" fill="url(#title)" letter-spacing="-2">GRAPPLE</text>
    <text x="60" y="290" font-size="120" fill="url(#title)" letter-spacing="-2">GLIDERS</text>
  </g>

  <!-- Tagline -->
  <text x="62" y="370" font-family="'Rajdhani', 'Arial', sans-serif" font-weight="600" font-size="26" fill="#eaffff" opacity="0.92" letter-spacing="2">
    Neon synthwave grappling-hook climber
  </text>
  <text x="62" y="400" font-family="'Rajdhani', 'Arial', sans-serif" font-weight="500" font-size="20" fill="#a4f0ff" opacity="0.7" letter-spacing="1">
    Five modes · Daily challenge · Bot races · Time attack
  </text>

  <!-- Lava base -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#lava)" opacity="0.85"/>
  <path d="M 0 590 Q 100 575 200 590 T 400 590 T 600 590 T 800 590 T 1000 590 T 1200 590" fill="none" stroke="#fff7c2" stroke-width="3" opacity="0.7"/>
</svg>

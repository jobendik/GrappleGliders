name = "grapple-gliders-leaderboard"
main = "cloudflare-worker.ts"
compatibility_date = "2025-01-01"

# Run `wrangler kv namespace create LEADERBOARD` and paste the printed `id` here.
[[kv_namespaces]]
binding = "LEADERBOARD"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: require an API key on POST. Set with `wrangler secret put API_KEY`.
# [vars]
# API_KEY = ""

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0524"/>
      <stop offset="1" stop-color="#03040a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="0.5" stop-color="#c566ff"/>
      <stop offset="1" stop-color="#ff2bff"/>
    </linearGradient>
    <linearGradient id="you" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="bloom"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Modal -->
  <rect x="160" y="60" width="960" height="600" rx="22" fill="#070c1c" opacity="0.95" stroke="#00f3ff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="140" font-family="'Orbitron', sans-serif" font-weight="900" font-size="44" fill="url(#title)" filter="url(#bloom)">DAILY CHALLENGE</text>
  <text x="200" y="140" font-family="'Orbitron', sans-serif" font-weight="900" font-size="44" fill="url(#title)">DAILY CHALLENGE</text>
  <text x="200" y="178" font-family="'Rajdhani', sans-serif" font-weight="500" font-size="17" fill="#a4f0ff">2026-05-20 · Seed 7a3c91 · Every player on Earth gets the same course.</text>

  <!-- Stat tiles -->

        <rect width="855" height="32" rx="8" fill="url(#you)"/>
        <text x="10" y="22" fill="#001015" font-weight="800">#12</text>
        <text x="70" y="22" fill="#001015" font-weight="800">PILOT_NEO</text>
        <text x="845" y="22" text-anchor="end" fill="#001015" font-weight="900">36,420</text>
      </g>
      <g transform="translate(0 165)"><text x="0" y="0" fill="#a4f0ff" font-weight="600">#13</text><text x="60" y="0" fill="#eaffff" font-weight="600">GLITCH_HD</text><text x="850" y="0" text-anchor="end" fill="#eaffff" font-weight="700">34,150</text></g>
      <g transform="translate(0 195)"><text x="0" y="0" fill="#a4f0ff" font-weight="600">#14</text><text x="60" y="0" fill="#eaffff" font-weight="600">RUNE7</text><text x="850" y="0" text-anchor="end" fill="#eaffff" font-weight="700">32,790</text></g>
      <g transform="translate(0 225)"><text x="0" y="0" fill="#a4f0ff" font-weight="600">#15</text><text x="60" y="0" fill="#eaffff" font-weight="600">VEX01</text><text x="850" y="0" text-anchor="end" fill="#eaffff" font-weight="700">30,002</text></g>

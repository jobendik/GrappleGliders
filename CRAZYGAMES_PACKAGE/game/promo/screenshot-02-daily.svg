    <g transform="translate(785 210)">
      <rect width="295" height="80" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="295" height="2" fill="#00f3ff" opacity="0.55"/>
      <text x="14" y="28" font-size="11" letter-spacing="2" fill="#a4f0ff" font-weight="700">NEXT DAILY</text>
      <text x="14" y="62" font-size="22" font-family="'Orbitron', sans-serif" font-weight="900" fill="#00f3ff">12:47:09</text>
    </g>
  </g>

  <!-- Leaderboard rows -->
  <g transform="translate(200 320)" font-family="'Rajdhani', sans-serif">
    <rect width="880" height="270" rx="12" fill="#02050c" opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
    <g transform="translate(14 18)" font-size="15">
      <g><text x="0" y="0" fill="#ffd400" font-weight="800">#1</text><text x="60" y="0" fill="#eaffff" font-weight="700">SOLAR_X</text><text x="850" y="0" text-anchor="end" fill="#ffffff" font-weight="800">62,810</text></g>
      <g transform="translate(0 30)"><text x="0" y="0" fill="#a4f0ff" font-weight="800">#2</text><text x="60" y="0" fill="#eaffff" font-weight="700">APEX_pro</text><text x="850" y="0" text-anchor="end" fill="#ffffff" font-weight="800">58,440</text></g>
      <g transform="translate(0 60)"><text x="0" y="0" fill="#a4f0ff" font-weight="800">#3</text><text x="60" y="0" fill="#eaffff" font-weight="700">NOVA99</text><text x="850" y="0" text-anchor="end" fill="#ffffff" font-weight="800">52,008</text></g>
      <g transform="translate(0 90)"><text x="0" y="0" fill="#eaffff" font-weight="700">#7</text><text x="60" y="0" fill="#eaffff" font-weight="600">PYRE_v2</text><text x="850" y="0" text-anchor="end" fill="#eaffff" font-weight="700">41,990</text></g>
      <!-- You highlighted -->

    <g transform="translate(395 210)">
      <rect width="180" height="80" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="180" height="2" fill="#00f3ff" opacity="0.55"/>
      <text x="14" y="28" font-size="11" letter-spacing="2" fill="#a4f0ff" font-weight="700">YOUR RANK</text>
      <text x="14" y="62" font-size="22" font-family="'Orbitron', sans-serif" font-weight="900" fill="#00f3ff">#12</text>
    </g>
    <g transform="translate(590 210)">
      <rect width="180" height="80" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect width="180" height="2" fill="#00f3ff" opacity="0.55"/>
      <text x="14" y="28" font-size="11" letter-spacing="2" fill="#a4f0ff" font-weight="700">RANKED</text>
      <text x="14" y="62" font-size="22" font-family="'Orbitron', sans-serif" font-weight="900" fill="#00f3ff">SUBMITTED</text>

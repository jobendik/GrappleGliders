  <!-- Disclaimer -->
  <text x="200" y="608" font-family="'Rajdhani', sans-serif" font-size="11" fill="#a4f0ff" opacity="0.6">Showing 38 real players blended with deterministic bots; cross-device via cloud save.</text>

  <!-- CTA -->
  <g transform="translate(200 624)" font-family="'Orbitron', sans-serif">
